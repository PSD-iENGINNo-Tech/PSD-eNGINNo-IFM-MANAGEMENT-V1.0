<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PSD eNGINNo IFM Management</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* Layout: fixed left nav (Hard / Soft / Management) + sticky topbar + scrolling work area. Dark-first, same token set as iMATOMs modules. */
:root{
  --bg:#0D1117;--bg2:#161B22;--bg3:#1C2333;--bg4:#21262D;
  --border:#30363D;--border2:#3D444D;
  --text:#E6EDF3;--text2:#8B949E;--text3:#6E7681;--grid:rgba(255,255,255,.05);
  --topbar:rgba(13,17,23,.92);--overlay:rgba(0,0,0,.72);
  --orange:#F97316;--green:#22C55E;--yellow:#EAB308;--red:#EF4444;--blue:#3B82F6;--purple:#A855F7;--teal:#14B8A6;--pink:#EC4899;--lime:#84CC16;
  --accent:#F97316;--hard:#F97316;--soft:#14B8A6;
  --font:'Sarabun',system-ui,sans-serif;--font-display:'Rajdhani','Sarabun',sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;
  --radius:8px;--radius-lg:12px;--sidebar-w:258px;--header-h:58px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F2F4F7;--bg2:#FFFFFF;--bg3:#EEF1F5;--bg4:#E2E7EE;--border:#D5DCE5;--border2:#BFC8D4;
  --text:#0F172A;--text2:#475569;--text3:#64748B;--grid:rgba(15,23,42,.07);--topbar:rgba(255,255,255,.92);--overlay:rgba(15,23,42,.45);
  --accent:#EA580C;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F2F4F7;--bg2:#FFFFFF;--bg3:#EEF1F5;--bg4:#E2E7EE;--border:#D5DCE5;--border2:#BFC8D4;
  --text:#0F172A;--text2:#475569;--text3:#64748B;--grid:rgba(15,23,42,.07);--topbar:rgba(255,255,255,.92);--overlay:rgba(15,23,42,.45);
  --accent:#EA580C;color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0D1117;--bg2:#161B22;--bg3:#1C2333;--bg4:#21262D;--border:#30363D;--border2:#3D444D;
  --text:#E6EDF3;--text2:#8B949E;--text3:#6E7681;--grid:rgba(255,255,255,.05);--topbar:rgba(13,17,23,.92);--overlay:rgba(0,0,0,.72);
  --accent:#F97316;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:14px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* SIDEBAR */
#sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;overflow-y:auto;padding-left:env(safe-area-inset-left,0px);transition:transform .2s}
.sb-hd{padding:16px 16px 14px;border-bottom:1px solid var(--border)}
.sb-brand{display:flex;gap:10px;align-items:center}
.sb-mark{width:38px;height:38px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.5px;flex-shrink:0}
.sb-logo{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent)}
.sb-title{font-family:var(--font-display);font-size:17px;font-weight:700;line-height:1.1}
.sb-sub{font-size:11px;color:var(--text3);margin-top:2px}
.sb-biz{margin-top:12px;display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;cursor:pointer}
.sb-biz:hover{border-color:var(--accent)}
.sb-biz .bi{font-size:18px}
.sb-biz .bn{font-size:12px;font-weight:600;line-height:1.2}
.sb-biz .bs{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.sb-sec{padding:14px 18px 5px;font-size:10px;font-weight:700;letter-spacing:1.6px;color:var(--text3);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.sb-sec .dot{width:7px;height:7px;border-radius:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius);margin:1px 8px;cursor:pointer;font-size:13px;color:var(--text2);border:1px solid transparent;background:none;width:calc(100% - 16px);text-align:left}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:color-mix(in srgb,var(--nc,var(--accent)) 13%,transparent);color:var(--text);border-color:color-mix(in srgb,var(--nc,var(--accent)) 35%,transparent)}
.nav-item .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px;background:color-mix(in srgb,var(--nc,var(--accent)) 14%,transparent);flex-shrink:0}
.nav-item .th{font-size:10px;color:var(--text3);display:block;line-height:1.1}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center}
.sb-ft{margin-top:auto;padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)}
#sb-overlay{display:none;position:fixed;inset:0;background:var(--overlay);z-index:90}

/* MAIN */
#main{margin-left:var(--sidebar-w);min-height:100vh}
#topbar{position:sticky;top:env(safe-area-inset-top,0px);min-height:var(--header-h);background:var(--topbar);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:8px max(20px,env(safe-area-inset-right,0px)) 8px 20px;gap:12px;z-index:50;flex-wrap:wrap}
#hamb{display:none}
.tb-title{font-family:var(--font-display);font-size:19px;font-weight:700;line-height:1.1}
.tb-bc{font-size:11px;color:var(--text3)}
.tb-act{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#clock{font-family:var(--font-mono);font-size:12px;color:var(--text3)}
#content{padding:22px max(20px,env(safe-area-inset-right,0px)) 40px 20px}

/* PRIMITIVES */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;min-width:0}
.card-t{font-family:var(--font-display);font-weight:700;font-size:15px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-t small{font-family:var(--font);font-weight:400;font-size:11px;color:var(--text3)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--kc,var(--accent))}
.kpi-l{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.kpi-v{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1;color:var(--kc,var(--text));font-variant-numeric:tabular-nums}
.kpi-v small{font-size:14px;margin-left:2px}
.kpi-s{font-size:11px;color:var(--text3);margin-top:5px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.chart-wrap{position:relative;height:250px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sec-title{font-family:var(--font-display);font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px;text-wrap:balance}
.sec-sub{font-size:12px;color:var(--text3);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:5px;text-transform:uppercase}
.pill-hard{background:color-mix(in srgb,var(--hard) 15%,transparent);color:var(--hard)}
.pill-soft{background:color-mix(in srgb,var(--soft) 15%,transparent);color:var(--soft)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);font-size:13px;cursor:pointer;border:1px solid;font-weight:600;white-space:nowrap}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:var(--border2);color:var(--text2)}.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.btn-danger{background:transparent;border-color:var(--red);color:var(--red)}.btn-danger:hover{background:color-mix(in srgb,var(--red) 12%,transparent)}
.btn-ok{background:transparent;border-color:var(--green);color:var(--green)}
.btn-sm{padding:5px 10px;font-size:12px}.btn-ic{padding:4px 7px;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--bc) 14%,transparent);color:var(--bc)}
.b-green{--bc:var(--green)}.b-yellow{--bc:var(--yellow)}.b-red{--bc:var(--red)}.b-blue{--bc:var(--blue)}.b-orange{--bc:var(--orange)}.b-gray{--bc:var(--text2)}.b-teal{--bc:var(--teal)}.b-purple{--bc:var(--purple)}
.svc-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;background:color-mix(in srgb,var(--sc) 13%,transparent);color:var(--sc);white-space:nowrap}
.tag{display:inline-block;background:var(--bg4);border:1px solid var(--border);border-radius:4px;padding:1px 7px;font-size:11px;font-family:var(--font-mono);color:var(--text2);white-space:nowrap}
.alert{padding:10px 14px;border-radius:var(--radius);margin-bottom:12px;font-size:13px;border:1px solid;background:color-mix(in srgb,var(--ac) 10%,transparent);border-color:color-mix(in srgb,var(--ac) 30%,transparent);color:var(--text)}
.alert b{color:var(--ac)}
.a-info{--ac:var(--blue)}.a-warn{--ac:var(--yellow)}.a-danger{--ac:var(--red)}.a-ok{--ac:var(--green)}
.metric-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.metric-row:last-child{border-bottom:none}
.bar{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;border-radius:3px}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--bg3);border-radius:var(--radius);padding:3px;margin-bottom:14px;overflow-x:auto}
.tab{padding:7px 14px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--text2);font-weight:600;border:none;background:none;white-space:nowrap}
.tab.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* TABLE */
.tbar{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;font-size:13px;font-family:var(--font);color:var(--text);outline:none}
.search:focus,.fc:focus{border-color:var(--accent)}
.count{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--bg2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg3);padding:9px 12px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg3);color:var(--text)}
td.strong{color:var(--text);font-weight:600}
td.desc{max-width:280px;min-width:160px}
td.act{white-space:nowrap;text-align:right}
td.empty{text-align:center;padding:28px;color:var(--text3)}
.num{text-align:right}

/* FORM / MODAL */
.fc{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 11px;font-size:13px;font-family:var(--font);color:var(--text);outline:none}
select.fc option{background:var(--bg3);color:var(--text)}
.fg{display:flex;flex-direction:column;gap:5px}
.fl{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.5px;text-transform:uppercase}
.fl .req{color:var(--red)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.modal-ov{position:fixed;inset:0;background:var(--overlay);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-ov.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;width:700px;max-width:100%;max-height:90vh;overflow-y:auto}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.modal-t{font-family:var(--font-display);font-size:19px;font-weight:700}
.modal-f{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;align-items:center}
.ferr{color:var(--red);font-size:12px;margin-right:auto}

/* DASHBOARD */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.hero-main{display:flex;gap:18px;align-items:center}
.hero-ic{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-size:32px;background:color-mix(in srgb,var(--bzc) 16%,transparent);border:1px solid color-mix(in srgb,var(--bzc) 40%,transparent);flex-shrink:0}
.hero-k{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);font-weight:700}
.hero-n{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.1;text-wrap:balance}
.hero-s{font-size:12px;color:var(--text3);margin-top:4px}
.idx{display:flex;align-items:center;gap:18px}
.idx-v{font-family:var(--font-display);font-size:58px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
.idx-split{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.svc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media(max-width:1500px){.svc-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:700px){.svc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.svc-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;cursor:pointer;text-align:left;color:inherit;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--sc)}
.svc-card:hover{border-color:var(--sc)}
.svc-top{display:flex;justify-content:space-between;align-items:center}
.svc-ic{font-size:20px}
.svc-n{font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.1}
.svc-th{font-size:11px;color:var(--text3)}
.svc-score{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.svc-meta{font-size:11px;color:var(--text3);display:flex;justify-content:space-between}
.alert-list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.al{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:var(--radius);background:var(--bg3);cursor:pointer;border-left:3px solid var(--ac)}
.al:hover{background:var(--bg4)}
.al .m{font-size:12.5px;color:var(--text);line-height:1.35}
.al .s{font-size:11px;color:var(--text3)}

/* BIZ PICKER */
.biz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.biz-card{background:var(--bg3);border:2px solid var(--border);border-radius:var(--radius-lg);padding:16px;cursor:pointer;text-align:left;color:inherit;display:flex;flex-direction:column;gap:6px}
.biz-card:hover{border-color:var(--bzc)}
.biz-card.on{border-color:var(--bzc);background:color-mix(in srgb,var(--bzc) 9%,var(--bg2))}
.biz-card .i{font-size:28px}
.biz-card .n{font-family:var(--font-display);font-size:17px;font-weight:700}
.biz-card .d{font-size:11.5px;color:var(--text3);line-height:1.4}

#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:calc(20px + env(safe-area-inset-right,0px));background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius-lg);padding:11px 18px;font-size:13px;z-index:999;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 40px)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

@media(max-width:1100px){.hero,.grid-3{grid-template-columns:1fr}}
@media(max-width:900px){
  #sidebar{transform:translateX(-100%)}
  body.sb-open #sidebar{transform:none}
  body.sb-open #sb-overlay{display:block}
  #main{margin-left:0}
  #hamb{display:inline-flex}
  .grid-2{grid-template-columns:1fr}
  #topbar{padding-left:max(16px,env(safe-area-inset-left,0px))}
  #content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media(max-width:560px){
  .form-grid{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .idx{flex-direction:column;align-items:flex-start}
  #clock,.tb-bc{display:none}
  .sec-title{font-size:20px}
}
</style>
</head>
<body>
<nav id="sidebar" aria-label="เมนูหลัก">
  <div class="sb-hd">
    <div class="sb-brand">
      <div class="sb-mark">IFM</div>
      <div><div class="sb-logo">PSD eNGINNo</div><div class="sb-title">IFM Management</div><div class="sb-sub">Integrated Facility Management · Ver 1.0</div></div>
    </div>
    <button class="sb-biz" id="sb-biz" onclick="showView('settings')" style="width:100%;color:inherit;text-align:left"></button>
  </div>
  <div id="nav"></div>
  <div class="sb-ft">
    <div style="color:var(--accent);font-family:var(--font-display);font-weight:700;font-size:12px">PSD eNGINNo · IFM</div>
    <div style="margin-top:2px">Hard + Soft Services · 6 Business Types · 2026</div>
    <a href="PSD_eNGINNo_IFM_Mobile_v1_0.html" style="display:inline-block;margin-top:8px;color:var(--accent);font-weight:600;text-decoration:none">📱 เปิด IFM Mobile App ›</a>
  </div>
</nav>
<div id="sb-overlay" onclick="document.body.classList.remove('sb-open')"></div>

<main id="main">
  <header id="topbar">
    <button id="hamb" class="btn btn-ghost btn-sm" onclick="document.body.classList.add('sb-open')" aria-label="เปิดเมนู">☰</button>
    <div style="min-width:0">
      <div class="tb-title" id="tb-title">IFM Command Center</div>
      <div class="tb-bc" id="tb-bc">PSD eNGINNo › IFM</div>
    </div>
    <div class="tb-act">
      <span id="clock"></span>
      <select class="fc" id="biz-switch" style="width:auto;padding:6px 10px" onchange="setBiz(this.value)" aria-label="ประเภทธุรกิจ"></select>
      <button class="btn btn-ghost btn-sm" onclick="cycleTheme()" id="theme-btn" title="สลับธีม">ธีม</button>
      <a class="btn btn-ghost btn-sm" href="PSD_eNGINNo_IFM_Mobile_v1_0.html" style="text-decoration:none" title="เปิด Mobile App">📱 Mobile</a>
      <button class="btn btn-primary btn-sm" onclick="quickWR()">+ แจ้งงาน</button>
    </div>
  </header>
  <div id="content"></div>
</main>

<div class="modal-ov" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-h"><div class="modal-t" id="modal-t"></div><button class="btn btn-ghost btn-ic" onclick="closeModal()" aria-label="ปิด">✕</button></div>

// ---------- KPI calculations ----------
function slaOf(t){const S=SLA[t.priority]||SLA.P3,f=S.f*6e4,st=new Date(t.date).getTime();
  if(t.completedAt){return{s:(new Date(t.completedAt).getTime()-st)<=f?'met':'breach'}}
  if(t.status==='On Hold')return{s:'hold'};
  const left=st+f-Date.now();return left<0?{s:'breach',open:1}:{s:'open',left:left/6e4}}
function slaPct(svc){let m=0,b=0;D.tickets.forEach(t=>{if(svc&&t.service!==svc)return;const s=slaOf(t).s;if(s==='met')m++;else if(s==='breach')b++});return m+b?Math.round(m/(m+b)*100):100}
function pmPct(svc){const t=D.pm.filter(p=>p.service===svc&&p.dueDate<=todayS);return t.length?Math.round(t.filter(p=>p.status==='Done').length/t.length*100):100}
function compRows(svc){return D.compliance.filter(x=>!svc||x.service===svc).map(SCH.compliance.derive)}
function compPct(svc){const c=compRows(svc);return c.length?Math.round(c.filter(x=>x.status!=='Overdue').length/c.length*100):100}
function uptime(){const a=D.assets;return a.length?Math.round(a.filter(x=>x.status==='Running'||x.status==='Standby').length/a.length*100):100}
function defClose(){const d=D.defects;return d.length?Math.round(d.filter(x=>x.status==='Closed').length/d.length*100):100}
function hkScore(days=30){const s=D.hkInsp.filter(x=>x.date>=addD(todayS,-days));return s.length?avg(s.map(x=>x.score)):0}
function hkDone(){const t=D.hkTasks;return t.length?Math.round(t.filter(x=>x.status==='Done').length/t.length*100):100}
function patrolPct(post){const p=D.patrols.filter(x=>x.date>=addD(todayS,-7)&&(!post||x.post===post));const pl=sum(p,x=>x.planned);return pl?Math.round(sum(p,x=>x.scanned)/pl*100):100}
function incClose(){const s=D.secInc;return s.length?Math.round(s.filter(x=>x.status==='Closed').length/s.length*100):100}
function pestPct(){const s=D.pestSt;return s.length?Math.round(s.filter(x=>x.activity==='None'||x.activity==='Low').length/s.length*100):100}
function gdnPct(){const z=D.gdnZones;return z.length?Math.round(sum(z,x=>x.health==='Good'?1:x.health==='Fair'?.6:0)/z.length*100):100}
function gdnOnTime(){const t=D.gdnTasks.filter(x=>x.status!=='Scheduled');return t.length?Math.round(t.filter(x=>x.status==='Done').length/t.length*100):100}
function linPct(){return D.linenItems.length?avg(D.linenItems.map(x=>SCH.linenItems.derive(x)._avail)):100}
function linLoss(){const par=sum(D.linenItems,x=>x.par);return par?Math.round(sum(D.linenItems,x=>(+x.reject||0)+(+x.lost||0))/par*1000)/10:0}
const SCORE={
  eng:()=>avg([slaPct('eng'),pmPct('eng'),uptime(),compPct('eng')]),
  fac:()=>avg([slaPct('fac'),pmPct('fac'),compPct('fac'),defClose()]),
  hk:()=>avg([slaPct('hk'),hkScore(),hkDone()]),
  sec:()=>avg([slaPct('sec'),patrolPct(),incClose()]),
  pest:()=>avg([slaPct('pest'),pestPct()]),
  gdn:()=>avg([slaPct('gdn'),gdnPct(),gdnOnTime()]),
  lin:()=>avg([slaPct('lin'),linPct()]),
};
function KPIS(){const T=P().target;return[
  ['eng','SLA งานแจ้งซ่อม',()=>slaPct('eng'),T.sla,'%'],['eng','PM Compliance',()=>pmPct('eng'),T.pm,'%'],['eng','Asset Uptime',uptime,T.uptime,'%'],['eng','Statutory Compliance',()=>compPct('eng'),100,'%'],
  ['fac','SLA งานแจ้งซ่อม',()=>slaPct('fac'),T.sla,'%'],['fac','PM Compliance (อาคาร)',()=>pmPct('fac'),T.pm,'%'],['fac','Life-safety Compliance',()=>compPct('fac'),100,'%'],['fac','Defect Closure',defClose,85,'%'],
  ['hk','SLA งานแจ้ง',()=>slaPct('hk'),T.sla,'%'],['hk','Cleanliness Score (30 วัน)',()=>hkScore(),T.hk,'%'],['hk','Task Completion',hkDone,95,'%'],
  ['sec','SLA งานแจ้ง',()=>slaPct('sec'),T.sla,'%'],['sec','Patrol Compliance (7 วัน)',()=>patrolPct(),T.patrol,'%'],['sec','Incident Closure',incClose,90,'%'],
  ['pest','SLA งานแจ้ง',()=>slaPct('pest'),T.sla,'%'],['pest','Station Clean Rate',pestPct,T.pest,'%'],
  ['gdn','SLA งานแจ้ง',()=>slaPct('gdn'),T.sla,'%'],['gdn','Zone Health',gdnPct,T.gdn,'%'],['gdn','Task On-time',gdnOnTime,90,'%'],
  ['lin','SLA งานแจ้ง',()=>slaPct('lin'),T.sla,'%'],['lin','Linen Availability',linPct,T.lin,'%'],['lin','Reject + Lost Rate',linLoss,2,'%',1],
]}
const scoreColor=v=>v>=90?'var(--green)':v>=75?'var(--yellow)':'var(--red)';
const openWR=svc=>D.tickets.filter(t=>(!svc||t.service===svc)&&t.status!=='Closed'&&t.status!=='Completed').length;

function alerts(){const A=[];
  D.tickets.forEach(t=>{const s=slaOf(t);if(s.s==='breach'&&s.open)A.push({lv:'red',svc:t.service,m:`${t.id} เกิน SLA — ${t.desc}`,s:`${t.area} · ${t.priority}`,v:'helpdesk'})});
  D.assets.filter(a=>a.status==='Down').forEach(a=>A.push({lv:'red',svc:'eng',m:`${a.name} หยุดทำงาน`,s:`${a.area} · Criticality ${a.crit}`,v:'eng'}));
  compRows().filter(c=>c.status==='Overdue').forEach(c=>A.push({lv:'red',svc:c.service,m:`Compliance เลยกำหนด: ${c.item}`,s:`${c.standard} · ครบ ${fmtD(c._nextDue)}`,v:c.service}));
  D.defects.filter(d=>d.status!=='Closed'&&(d.severity==='Critical'||d.target<todayS)).forEach(d=>A.push({lv:d.severity==='Critical'?'red':'yellow',svc:'fac',m:`Defect ${d.element}: ${d.desc}`,s:`${d.area} · กำหนด ${fmtD(d.target)}`,v:'fac'}));
  D.pestSt.filter(s=>s.activity==='High').forEach(s=>A.push({lv:'yellow',svc:'pest',m:`พบความเคลื่อนไหวสูง — ${s.type}`,s:`${s.id} · ${s.area}`,v:'pest'}));
  D.linenItems.map(SCH.linenItems.derive).filter(x=>x._avail<90).forEach(x=>A.push({lv:'yellow',svc:'lin',m:`ผ้าต่ำกว่า Par: ${x.name}`,s:`Availability ${x._avail}%`,v:'lin'}));
  compRows().filter(c=>c.status==='Due Soon').forEach(c=>A.push({lv:'blue',svc:c.service,m:`ใกล้ครบกำหนด: ${c.item}`,s:`อีก ${c._dl} วัน`,v:c.service}));
  const o={red:0,yellow:1,blue:2};return A.sort((a,b)=>o[a.lv]-o[b.lv]);
}

const kpi=(l,v,s,c)=>`<div class="kpi" style="--kc:${c||'var(--accent)'}"><div class="kpi-l">${l}</div><div class="kpi-v">${v}</div><div class="kpi-s">${s||''}</div></div>`;

function chartTheme(){if(!window.Chart)return;Chart.defaults.color=tok('--text2');Chart.defaults.borderColor=tok('--grid');Chart.defaults.font.family="'Sarabun',sans-serif";Chart.defaults.font.size=11}
const axOpts=(extra={})=>({responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:10,boxHeight:10}}},scales:{x:{grid:{color:tok('--grid')}},y:{grid:{color:tok('--grid')},beginAtZero:true}},...extra});

// ---------- generic table ----------
function tbl(ent,opt={}){const cid='t_'+ent+'_'+(opt.key||CUR);TB[cid]={ent,opt};Q.push(()=>renderTbl(cid));return`<div id="${cid}"></div>`}
function colLabel(ent,c){const S=SCH[ent];if(S.colL&&S.colL[c])return S.colL[c];if(c==='id')return 'ID';if(c==='_sla')return 'SLA';if(c==='_pct')return '%';const f=S.fields.find(x=>x.k===c);return f?(typeof f.l==='function'?f.l():f.l):c}
function cell(ent,c,r){
  const S=SCH[ent],v=r[c];
  if(c==='id')return`<span class="tag">${esc(v)}</span>`;
  if(c==='service')return chip(v);
  if(c==='_sla'){const s=slaOf(r);return s.s==='met'?badge('Met'):s.s==='breach'?badge('Breached'):s.s==='hold'?badge('On Hold'):`<span class="badge b-${s.left<60?'orange':'blue'}">เหลือ ${fmtDur(s.left)}</span>`}
  if(c==='_pct'){const p=r.planned?Math.round(r.scanned/r.planned*100):0;return`<b style="color:${scoreColor(p)}">${p}%</b>`}
  if(c==='_avail')return`<div style="min-width:90px"><b style="color:${scoreColor(v)}">${v}%</b><div class="bar"><i style="width:${v}%;background:${scoreColor(v)}"></i></div></div>`;
  if(c==='_nextDue'||c==='_next'){const dl=dBetween(todayS,v);return`${fmtD(v)} <span style="font-size:11px;color:${dl<0?'var(--red)':dl<=30?'var(--yellow)':'var(--text3)'}">(${dl<0?'เลย '+(-dl):'อีก '+dl} วัน)</span>`}
  if(c==='_total')return fmtN(v);
  if(c==='status'||c==='severity'||c==='activity'||c==='health'||c==='risk'||c==='crit'||c==='employment')return badge(v);
  if(c==='priority')return badge(v);
  if(c==='score')return`<b style="color:${scoreColor(+v)}">${esc(v)}${ent==='hkInsp'||ent==='vendors'?'%':''}</b>`;
  if(c==='value')return '฿'+fmtN(v);
  const f=S.fields.find(x=>x.k===c);
  if(f){if(f.t==='date')return fmtD(v);if(f.t==='datetime')return fmtDT(v);if(f.t==='number')return fmtN(v)}
  if(c==='name'||c==='item'||c==='task'||c==='zone')return`<span style="color:var(--text);font-weight:600">${esc(v)}</span>`;
  if(c==='desc'||c==='action'||c==='remark'||c==='findings'||c==='scope')return`<div style="max-width:300px;min-width:150px">${esc(v)||'—'}</div>`;
  return esc(v)||'—';
}
function rowActs(ent,r){let h='';
  if(ent==='tickets'){const i=FLOW.indexOf(r.status);if(i>=0&&i<FLOW.length-1)h+=`<button class="btn btn-ok btn-ic" title="เปลี่ยนเป็น ${FLOW[i+1]}" onclick="advance('${r.id}')">▶ ${FLOW[i+1]}</button> `}
  if(ent==='pm'&&r.status!=='Done')h+=`<button class="btn btn-ok btn-ic" onclick="markDone('pm','${r.id}')">✓ Done</button> `;
  if(ent==='hkTasks'&&r.status!=='Done')h+=`<button class="btn btn-ok btn-ic" onclick="markDone('hkTasks','${r.id}')">✓ Done</button> `;
  if(ent==='compliance')h+=`<button class="btn btn-ok btn-ic" title="บันทึกว่าดำเนินการวันนี้" onclick="markDone('compliance','${r.id}')">✓ ทำแล้ว</button> `;
  if(ent==='visitors'&&!r.timeOut)h+=`<button class="btn btn-ok btn-ic" onclick="checkout('${r.id}')">ออก</button> `;
  h+=`<button class="btn btn-ghost btn-ic" title="แก้ไข" onclick="openForm('${ent}','${r.id}')">✎</button> <button class="btn btn-ghost btn-ic" title="ลบ" onclick="delRow('${ent}','${r.id}',this)">🗑</button>`;
  return h}
function renderTbl(cid){
  const T=TB[cid];if(!T)return;const{ent,opt}=T,S=SCH[ent],el=document.getElementById(cid);if(!el)return;
  let rows=D[ent].map(r=>S.derive?S.derive(r):r);
  if(opt.filter)rows=rows.filter(opt.filter);
  const q=(UI.q[cid]||'').toLowerCase().trim();
  if(q)rows=rows.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q));
  if(S.sort)rows.sort(S.sort);
  const cols=opt.cols||S.cols,total=rows.length;if(opt.limit)rows=rows.slice(0,opt.limit);
  el.innerHTML=`<div class="tbar"><input class="search" id="s_${cid}" placeholder="ค้นหา${esc(S.label)}…" value="${esc(UI.q[cid]||'')}" oninput="UI.q['${cid}']=this.value;renderTbl('${cid}');refocus('s_${cid}')">${opt.bar||''}<span class="count">${total} รายการ</span>${opt.noAdd?'':`<button class="btn btn-primary btn-sm" onclick="openForm('${ent}',null,'${cid}')">+ เพิ่ม${esc(S.label)}</button>`}<button class="btn btn-ghost btn-sm" onclick="exportCSV('${ent}')">⬇ CSV</button></div>
  <div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${esc(colLabel(ent,c))}</th>`).join('')}<th></th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${cols.map(c=>`<td>${cell(ent,c,r)}</td>`).join('')}<td class="act">${rowActs(ent,r)}</td></tr>`).join(''):`<tr><td colspan="${cols.length+1}" class="empty">ยังไม่มีข้อมูล — กด “+ เพิ่ม${esc(S.label)}” เพื่อบันทึกรายการแรก</td></tr>`}</tbody></table></div>`;
}
function refocus(id){const i=document.getElementById(id);if(i){i.focus();const n=i.value.length;i.setSelectionRange(n,n)}}

// ---------- CRUD ----------
let FORM=null;
function nextId(ent){const S=SCH[ent];const mx=D[ent].reduce((m,r)=>{const n=parseInt(String(r.id||'').split('-').pop(),10);return isNaN(n)?m:Math.max(m,n)},0);return S.pfx+'-'+pad(mx+1,S.l4?4:3)}
function openForm(ent,id,cidOrDefaults){
  const S=SCH[ent];const rec=id?D[ent].find(r=>r.id===id):null;
  let defs={};if(typeof cidOrDefaults==='string'&&TB[cidOrDefaults])defs=TB[cidOrDefaults].opt.defaults||{};else if(cidOrDefaults&&typeof cidOrDefaults==='object')defs=cidOrDefaults;
  const vals={};S.fields.forEach(f=>{vals[f.k]=rec?rec[f.k]:(defs[f.k]!=null?defs[f.k]:(typeof f.def==='function'?f.def():f.def??''))});
  FORM={ent,id};
  document.getElementById('modal-t').textContent=(rec?'แก้ไข':'เพิ่ม')+S.label+(rec?' · '+rec.id:'');
  document.getElementById('modal-err').textContent='';
  document.getElementById('modal-body').innerHTML=S.fields.map(f=>{
    const lab=typeof f.l==='function'?f.l():f.l,v=vals[f.k]??'',fid='f_'+f.k;let inp;
    if(f.t==='select'){let o=typeof f.o==='function'?f.o():f.o;o=o.map(x=>Array.isArray(x)?x:[x,x]);if(v!==''&&!o.some(x=>String(x[0])===String(v)))o.push([v,v]);inp=`<select class="fc" id="${fid}" ${f.k==='service'?'onchange="FORM&&refreshLists()"':''}>${f.req?'':'<option value="">—</option>'}${o.map(x=>`<option value="${esc(x[0])}" ${String(x[0])===String(v)?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`}
    else if(f.t==='textarea')inp=`<textarea class="fc" id="${fid}" rows="3">${esc(v)}</textarea>`;
    else{const ty=f.t==='datetime'?'datetime-local':f.t==='number'?'number':f.t==='date'?'date':'text';inp=`<input class="fc" id="${fid}" type="${ty}" value="${esc(v)}" ${f.list?`list="dl_${f.k}"`:''} ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} ${f.t==='number'?'step="any"':''}>${f.list?`<datalist id="dl_${f.k}"></datalist>`:''}`}
    return`<div class="fg ${f.full?'full':''}"><label class="fl" for="${fid}">${esc(lab)} ${f.req?'<span class="req">*</span>':''}</label>${inp}</div>`}).join('');
  refreshLists();
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>{const first=document.querySelector('#modal-body .fc');first&&first.focus()},50);
}
function refreshLists(){if(!FORM)return;const S=SCH[FORM.ent];const cur={};S.fields.forEach(f=>{const e=document.getElementById('f_'+f.k);if(e)cur[f.k]=e.value});
  S.fields.filter(f=>f.list).forEach(f=>{const dl=document.getElementById('dl_'+f.k);if(dl)dl.innerHTML=(f.list(cur)||[]).map(x=>`<option value="${esc(x)}">`).join('')})}
function closeModal(){document.getElementById('modal').classList.remove('open');FORM=null}
function submitForm(){
  if(!FORM)return;const{ent,id}=FORM,S=SCH[ent];const r=id?{...D[ent].find(x=>x.id===id)}:{};
  for(const f of S.fields){const e=document.getElementById('f_'+f.k);let v=e?e.value.trim():'';
    if(f.req&&v===''){document.getElementById('modal-err').textContent='กรุณากรอก “'+(typeof f.l==='function'?f.l():f.l)+'”';e&&e.focus();return}
    if(f.t==='number'&&v!==''){v=+v;if(f.max!=null&&v>f.max)v=f.max;if(f.min!=null&&v<f.min)v=f.min}
    r[f.k]=v}
  S.onSave&&S.onSave(r);
  if(id){const i=D[ent].findIndex(x=>x.id===id);D[ent][i]=r;toast('บันทึกการแก้ไข '+r.id+' แล้ว')}
  else{r.id=nextId(ent);S.onCreate&&S.onCreate(r);D[ent].unshift(r);toast('เพิ่ม '+r.id+' แล้ว')}
  save();closeModal();render();
}
function delRow(ent,id,btn){const key=ent+'|'+id;
  if(UI.del===key){D[ent]=D[ent].filter(r=>r.id!==id);UI.del=null;save();render();toast('ลบ '+id+' แล้ว');return}
  UI.del=key;btn.textContent='ยืนยันลบ';btn.className='btn btn-danger btn-ic';
  setTimeout(()=>{if(UI.del===key){UI.del=null;if(btn.isConnected){btn.textContent='🗑';btn.className='btn btn-ghost btn-ic'}}},3500)}
function advance(id){const t=D.tickets.find(x=>x.id===id);if(!t)return;const i=FLOW.indexOf(t.status);if(i<0||i>=FLOW.length-1)return;
  const n=isoDT(new Date());if(t.status==='New'){t.respondedAt=n;if(!t.assignee)t.assignee='Duty '+SVC[t.service].n}
  t.status=FLOW[i+1];if(t.status==='Completed'&&!t.completedAt)t.completedAt=n;save();render();toast(t.id+' → '+t.status)}
function markDone(ent,id){const r=D[ent].find(x=>x.id===id);if(!r)return;
  if(ent==='compliance'){r.lastDone=todayS;toast('บันทึกการดำเนินการ '+r.item+' วันนี้')}
  else{r.status='Done';if(ent==='hkTasks')r.lastDone=todayS;toast(id+' → Done')}
  save();render()}
function checkout(id){const v=D.visitors.find(x=>x.id===id);if(v){v.timeOut=isoDT(new Date());save();render();toast(v.name+' ออกจากพื้นที่แล้ว')}}
function quickWR(svc){const s=svc||(SVC[CUR]?CUR:'eng');openForm('tickets',null,{service:s})}

// ---------- export / backup ----------
function download(name,text,type){try{const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){toast('เบราว์เซอร์นี้ไม่อนุญาตให้ดาวน์โหลดไฟล์')}}
function exportCSV(ent){const S=SCH[ent];const rows=D[ent].map(r=>S.derive?S.derive(r):r);const keys=['id'].concat(S.fields.map(f=>f.k));if(S.cols.includes('status')&&!keys.includes('status'))keys.push('status');
  const head=keys.map(k=>k==='id'?'ID':colLabel(ent,k));const lines=[head].concat(rows.map(r=>keys.map(k=>r[k]??'')));
  const csv='﻿'+lines.map(l=>l.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  download(`IFM_${P().en.replace(/\s/g,'')}_${ent}_${todayS}.csv`,csv,'text/csv;charset=utf-8');toast('Export '+S.label+' ('+rows.length+' รายการ)')}
function backupJSON(){download(`IFM_${P().en.replace(/\s/g,'')}_backup_${todayS}.json`,JSON.stringify({biz:BIZK,data:D},null,1),'application/json');toast('สำรองข้อมูลแล้ว')}
function restoreJSON(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.data||!o.biz||!BIZ[o.biz])throw 0;BIZK=o.biz;LS.set('psd_ifm_biz',BIZK);D=o.data;save();buildChrome();showView('dashboard');toast('กู้คืนข้อมูล '+BIZ[BIZK].en+' แล้ว')}catch(e){toast('ไฟล์ไม่ถูกต้อง — ต้องเป็นไฟล์สำรองจาก IFM Management')}inp.value=''};rd.readAsText(f)}
let resetArm=false;
function resetData(btn){if(!resetArm){resetArm=true;btn.textContent='กดอีกครั้งเพื่อยืนยัน';btn.className='btn btn-danger btn-sm';setTimeout(()=>{resetArm=false;if(btn.isConnected){btn.textContent='รีเซ็ตเป็นข้อมูลตัวอย่าง';btn.className='btn btn-ghost btn-sm'}},4000);return}
  resetArm=false;D=seed(BIZK);save();render();buildNav();toast('รีเซ็ตข้อมูล '+P().en+' แล้ว')}

function buildNav(){document.getElementById('nav').innerHTML=NAV.map(([sec,col,items])=>`<div class="sb-sec">${col?`<span class="dot" style="background:${col}"></span>`:''}${sec}</div>`+items.map(it=>{
  const k=it[0],S=SVC[k];const ic=S?S.ic:it[1],n=S?S.n:it[2],th=S?S.th:it[3],c=S?S.c:'var(--accent)';
  const cnt=S?openWR(k):k==='helpdesk'?D.tickets.filter(t=>t.status==='New').length:0;
  return`<button class="nav-item ${CUR===k?'active':''}" style="--nc:${c}" onclick="showView('${k}')"><span class="ic">${ic}</span><span style="min-width:0">${n}<span class="th">${th}</span></span>${cnt?`<span class="nav-badge" ${S?'style="background:var(--bg4);color:var(--text2)"':''}>${cnt}</span>`:''}</button>`}).join('')).join('')}
function buildChrome(){const B=P();
  document.getElementById('sb-biz').innerHTML=`<span class="bi">${B.ic}</span><span style="min-width:0"><span class="bn" style="display:block">${B.n} · ${B.en}</span><span class="bs" style="display:block">${esc(D.site)}</span></span><span style="margin-left:auto;font-size:11px;color:var(--text3)">เปลี่ยน ›</span>`;
  document.getElementById('biz-switch').innerHTML=Object.entries(BIZ).map(([k,b])=>`<option value="${k}" ${k===BIZK?'selected':''}>${b.ic} ${b.n}</option>`).join('');
  buildNav()}
function showView(id){if(!VIEWS[id])id='dashboard';CUR=id;document.body.classList.remove('sb-open');render();window.scrollTo(0,0);try{history.replaceState(null,'','#'+id)}catch(e){}}
function render(){
  Object.values(charts).forEach(c=>c.destroy());charts={};Q=[];
  chartTheme();
  document.getElementById('content').innerHTML=VIEWS[CUR]();
  Q.forEach(f=>{try{f()}catch(e){console.error(e)}});Q=[];
  document.getElementById('tb-title').textContent=TITLES[CUR];
  const S=SVC[CUR];document.getElementById('tb-bc').textContent='PSD eNGINNo › IFM › '+P().en+(S?' › '+S.type+' Service':'')+' › '+TITLES[CUR];
  document.title='PSD eNGINNo IFM Management';
  buildNav();
}
function setBiz(k){if(!BIZ[k])return;BIZK=k;LS.set('psd_ifm_biz',k);load();UI.q={};UI.hd={svc:'',st:'',pri:''};buildChrome();render();toast('เปลี่ยนเป็น '+BIZ[k].ic+' '+BIZ[k].n+' — '+D.site)}

// theme
function themeMode(){return LS.get('psd_ifm_theme','system')}
function applyTheme(){const m=themeMode();if(m==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',m)}
function setTheme(m){LS.set('psd_ifm_theme',m);applyTheme();render()}
function cycleTheme(){const o=['system','dark','light'];setTheme(o[(o.indexOf(themeMode())+1)%3]);toast('ธีม: '+{system:'ตามระบบ',dark:'Dark',light:'Light'}[themeMode()])}
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(themeMode()==='system')render()})}catch(e){}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';t.style.transform='translateY(0)';clearTimeout(t._t);t._t=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(10px)'},2800)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
setInterval(()=>{const c=document.getElementById('clock');if(c)c.textContent=new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'})},1000);

// boot
applyTheme();load();buildChrome();
(function(){const h=(location.hash||'').slice(1);CUR=VIEWS[h]?h:'dashboard';render()})();
</script>
</body>
</html>
